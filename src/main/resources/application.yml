server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: FormCatch

  datasource:
    url: jdbc:h2:file:./data/formcatch;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: true

  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

# FormCatch 自定义配置
formcatch:
  # 公开链接的前缀
  public-path: /f/
  # 默认截止天数（表单创建后多少天自动关闭，0 表示不自动关闭）
  default-expire-days: 0
  # 防重复提交策略（可多选逗号分隔：cookie,ip,email）
  dedup-strategies: cookie,ip
  # 每个IP每天最大提交数
  max-submissions-per-ip-per-day: 50
