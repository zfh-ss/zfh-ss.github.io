<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>需要密码 · FormCatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet" crossorigin="anonymous">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<main class="container">
    <div class="form-view-card">
        <div class="fc-card fc-card-pad" style="padding: 2.5rem 2rem;">
            <h1 class="mb-3">🔒 该表单需要密码</h1>
            <p class="text-muted small mb-4">请联系发布者获取访问密码</p>

            <div th:if="${session.flash != null and session.flash.pwdError}"
                 class="alert alert-danger py-2 small">
                <span th:text="${session.flash.pwdError}"></span>
            </div>

            <form method="post" th:action="@{/f/{slug}/unlock(slug=${slug})}">
                <div class="mb-3">
                    <input type="password" name="accessCode" class="form-control"
                           placeholder="输入密码" required autofocus>
                </div>
                <button class="btn btn-primary w-100">进入</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
