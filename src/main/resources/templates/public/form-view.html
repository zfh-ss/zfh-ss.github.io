<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${form.title} + ' — FormCatch'">FormCatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet" crossorigin="anonymous">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<main class="container">
    <!-- 成功提示 -->
    <div th:if="${param.success != null}" class="form-view-card">
        <div class="fc-card p-5 bg-white text-center">
            <div class="display-4 mb-2">✅</div>
            <h4 class="mb-3">提交成功！</h4>
            <p class="text-muted mb-4">感谢您的填写</p>
            <a th:href="@{/f/{slug}(slug=${form.slug})}" class="btn btn-primary">再次查看</a>
        </div>
    </div>

    <!-- 错误提示 -->
    <div th:if="${param.error != null}" class="form-view-card">
        <div class="fc-card p-4 bg-white">
            <div class="alert alert-danger mb-0">
                <strong>提交失败：</strong>
                <span>请检查填写内容后重试</span>
            </div>
            <a th:href="@{/f/{slug}(slug=${form.slug})}" class="btn btn-outline-secondary mt-3">返回修改</a>
        </div>
    </div>

    <!-- 表单本体 -->
    <div th:if="${param.success == null and param.error == null and form != null}" class="form-view-card">
        <div class="fc-card p-5 bg-white" th:if="${form != null}">
            <div th:if="${closed}" class="alert alert-warning mb-0 text-center">
                <h5 class="mb-1">该表单已关闭</h5>
                <p class="text-muted mb-0 small">可能已过截止时间或被管理员关闭</p>
            </div>

            <div th:if="${!closed}">
                <h1 class="mb-1" th:text="${form.title}"></h1>
                <p class="text-muted mb-4" th:if="${form.description}" th:text="${form.description}"></p>

                <div class="small text-muted mb-4">
                    已收到 <span th:text="${submissionCount}"></span> 份填写
                    <span th:if="${form.quota != null}" class="ms-2">
                        · 剩余 <span th:text="${form.quota - submissionCount}"></span> 个名额
                    </span>
                </div>

                <form method="post"
                      th:action="@{/f/{slug}/submit(slug=${form.slug})}"
                      id="fc-form">

                    <div th:each="field : ${form.fields}" class="mb-4"
                         th:with="ft=${field.type}">

                        <label class="form-label fw-bold"
                               th:classappend="${field.required} ? 'required-mark'"
                               th:text="${field.label}"></label>

                        <!-- TEXT / TEXTAREA -->
                        <input th:if="${ft == T(com.formcatch.entity.FieldType).TEXT}"
                               type="text" class="form-control"
                               th:name="${field.name}"
                               th:required="${field.required}"
                               th:placeholder="${field.placeholder}">

                        <textarea th:if="${ft == T(com.formcatch.entity.FieldType).TEXTAREA}"
                                  class="form-control" rows="3"
                                  th:name="${field.name}"
                                  th:required="${field.required}"
                                  th:placeholder="${field.placeholder}"></textarea>

                        <!-- NUMBER -->
                        <input th:if="${ft == T(com.formcatch.entity.FieldType).NUMBER}"
                               type="number" step="any" class="form-control"
                               th:name="${field.name}"
                               th:required="${field.required}"
                               th:placeholder="${field.placeholder}">

                        <!-- DATE -->
                        <input th:if="${ft == T(com.formcatch.entity.FieldType).DATE}"
                               type="date" class="form-control"
                               th:name="${field.name}"
                               th:required="${field.required}">

                        <!-- EMAIL -->
                        <input th:if="${ft == T(com.formcatch.entity.FieldType).EMAIL}"
                               type="email" class="form-control"
                               th:name="${field.name}"
                               th:required="${field.required}"
                               th:placeholder="${field.placeholder}">

                        <!-- SELECT -->
                        <select th:if="${ft == T(com.formcatch.entity.FieldType).SELECT}"
                                class="form-select" th:name="${field.name}"
                                th:required="${field.required}">
                            <option value="">-- 请选择 --</option>
                            <option th:each="opt : ${#strings.arraySplit(field.options, ',')}"
                                    th:value="${#strings.trim(opt)}"
                                    th:text="${#strings.trim(opt)}"></option>
                        </select>

                        <!-- RADIO -->
                        <div th:if="${ft == T(com.formcatch.entity.FieldType).RADIO}"
                             th:each="opt : ${#strings.arraySplit(field.options, ',')}"
                             class="form-check">
                            <input class="form-check-input" type="radio"
                                   th:name="${field.name}"
                                   th:id="${field.name + '_' + __index}"
                                   th:value="${#strings.trim(opt)}"
                                   th:required="${field.required}">
                            <label class="form-check-label"
                                   th:for="${field.name + '_' + __index}"
                                   th:text="${#strings.trim(opt)}"></label>
                        </div>

                        <!-- CHECKBOX -->
                        <div th:if="${ft == T(com.formcatch.entity.FieldType).CHECKBOX}"
                             th:each="opt : ${#strings.arraySplit(field.options, ',')}"
                             class="form-check">
                            <input class="form-check-input" type="checkbox"
                                   th:name="${field.name}"
                                   th:id="${field.name + '_' + __index}"
                                   th:value="${#strings.trim(opt)}">
                            <label class="form-check-label"
                                   th:for="${field.name + '_' + __index}"
                                   th:text="${#strings.trim(opt)}"></label>
                        </div>

                        <small class="text-muted" th:if="${field.placeholder and (ft == T(com.formcatch.entity.FieldType).RADIO or ft == T(com.formcatch.entity.FieldType).CHECKBOX)}"
                               th:text="${field.placeholder}"></small>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100"
                            th:disabled="${closed}">
                        提交
                    </button>
                </form>
            </div>
        </div>
    </div>
</main>

<footer class="text-center text-muted small py-4 mt-5">
    <a th:href="@{/admin}" class="text-muted">FormCatch 管理</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
</body>
</html>
