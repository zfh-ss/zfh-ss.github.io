<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head('提交列表')"></head>
<body>
<nav th:replace="layout :: navbar('home')"></nav>

<main class="container">
    <div class="mb-3">
        <a th:href="@{/admin}" class="text-muted">← 返回表单列表</a>
        <h3 class="mt-2" th:text="${form.title}"></h3>
        <div class="text-muted small">
            共 <span th:text="${submissions.totalElements}"></span> 条提交
            · 当前第 <span th:text="${submissions.number + 1}"></span> 页
            · <a th:href="@{/f/{slug}/export(slug=${form.slug})}">导出全部 CSV</a>
        </div>
    </div>

    <div class="fc-card table-responsive">
        <table class="table table-hover mb-0 align-middle">
            <thead class="table-light">
            <tr>
                <th>#</th>
                <th>提交时间</th>
                <th>IP</th>
                <th>数据预览</th>
                <th class="text-end">操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${submissions.totalElements == 0}">
                <td colspan="5" class="text-center text-muted py-5">还没有提交记录</td>
            </tr>
            <tr th:each="sub : ${submissions.content}">
                <td th:text="${sub.id}"></td>
                <td th:text="${#temporals.format(sub.submittedAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                <td th:text="${sub.ipAddress}"></td>
                <td>
                    <code class="small text-truncate d-block"
                          th:text="${sub.dataJson.length() > 80} ? ${sub.dataJson.substring(0, 80) + '...'} : ${sub.dataJson}"></code>
                </td>
                <td class="text-end">
                    <a th:href="@{/admin/submissions/{sid}(sid=${sub.id})}"
                       class="btn btn-sm btn-outline-primary">详情</a>
                    <form method="post" th:action="@{/admin/submissions/{sid}/delete(sid=${sub.id})}"
                          class="d-inline" onsubmit="return confirm('删除该条提交？')">
                        <button class="btn btn-sm btn-outline-danger">删除</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- 分页 -->
    <nav th:if="${submissions.totalPages > 1}" class="mt-3">
        <ul class="pagination pagination-sm justify-content-center mb-0">
            <li class="page-item" th:classappend="${submissions.number == 0} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/admin/forms/{id}/submissions(id=${form.id}, page=${submissions.number - 1})}">上一页</a>
            </li>
            <li class="page-item active">
                <span class="page-link"
                      th:text="${submissions.number + 1} + ' / ' + ${submissions.totalPages}"></span>
            </li>
            <li class="page-item" th:classappend="${submissions.number + 1 >= submissions.totalPages} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/admin/forms/{id}/submissions(id=${form.id}, page=${submissions.number + 1})}">下一页</a>
            </li>
        </ul>
    </nav>
</main>

<footer th:replace="layout :: footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
</body>
</html>
