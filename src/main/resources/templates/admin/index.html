<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head('表单管理')"></head>
<body>
<nav th:replace="layout :: navbar('home')"></nav>

<main class="container">
    <div th:if="${msg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${msg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-end flex-wrap gap-3 mb-3">
        <div>
            <h1 class="page-title">我的表单</h1>
            <div class="page-sub mt-1" th:if="${forms.totalElements > 0}">
                共 <span th:text="${forms.totalElements}"></span> 个表单
            </div>
        </div>
        <form class="d-flex" method="get" th:action="@{/admin}">
            <input name="q" class="form-control form-control-sm fc-search me-2"
                   placeholder="搜索标题..." th:value="${q}">
            <button class="btn btn-sm btn-outline-secondary">搜索</button>
        </form>
    </div>

    <div class="table-responsive fc-card">
        <table class="fc-table">
            <thead>
            <tr>
                <th>标题</th>
                <th>链接</th>
                <th>状态</th>
                <th>字段</th>
                <th>创建时间</th>
                <th class="text-end">操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${forms.totalElements == 0}">
                <td colspan="6">
                    <div class="fc-empty">
                        还没有表单<br>
                        <a th:href="@{/admin/forms/new}" class="d-inline-block mt-2">立即创建一个 →</a>
                    </div>
                </td>
            </tr>
            <tr th:each="f : ${forms.content}">
                <td>
                    <a th:href="@{/admin/forms/{id}/edit(id=${f.id})}" th:text="${f.title}"
                       class="fw-medium text-body"></a>
                </td>
                <td>
                    <span class="fc-code" th:text="${'/f/' + f.slug}"></span>
                    <a th:href="@{/f/{slug}(slug=${f.slug})}" target="_blank"
                       class="small ms-1">打开</a>
                </td>
                <td>
                    <span class="dot" th:classappend="${f.enabled} ? 'green' : 'gray'"></span>
                    <span th:text="${f.enabled} ? '开启' : '关闭'"></span>
                    <span th:if="${f.deadline != null}"
                          class="ms-1 page-sub"
                          th:text="'截止 ' + ${#temporals.format(f.deadline, 'MM-dd HH:mm')}"></span>
                </td>
                <td th:text="${f.fields.size()}"></td>
                <td class="page-sub" th:text="${#temporals.format(f.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                <td class="text-end">
                    <a th:href="@{/admin/forms/{id}/edit(id=${f.id})}"
                       class="btn btn-sm btn-outline-secondary">编辑</a>
                    <a th:href="@{/admin/forms/{id}/submissions(id=${f.id})}"
                       class="btn btn-sm btn-outline-primary ms-1">查看提交</a>
                    <a th:href="@{/f/{slug}/export(slug=${f.slug})}"
                       class="btn btn-sm btn-outline-secondary ms-1">导出 CSV</a>
                    <form method="post" th:action="@{/admin/forms/{id}/delete(id=${f.id})}"
                          class="d-inline" onsubmit="return confirm('确认删除该表单？该表单的提交记录将一并清除，且不可恢复。')">
                        <button class="btn btn-sm btn-outline-danger ms-1">删除</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- 分页 -->
    <nav th:if="${forms.totalPages > 1}" class="mt-3">
        <ul class="pagination pagination-sm justify-content-center mb-0">
            <li class="page-item" th:classappend="${forms.number == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/admin(page=${forms.number - 1}, q=${q})}">上一页</a>
            </li>
            <li class="page-item active">
                <span class="page-link"
                      th:text="${forms.number + 1} + ' / ' + ${forms.totalPages}"></span>
            </li>
            <li class="page-item" th:classappend="${forms.number + 1 >= forms.totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/admin(page=${forms.number + 1}, q=${q})}">下一页</a>
            </li>
        </ul>
    </nav>
</main>

<footer th:replace="layout :: footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
</body>
</html>
