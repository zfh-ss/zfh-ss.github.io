<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head('表单管理')"></head>
<body>
<nav th:replace="layout :: navbar('home')"></nav>

<main class="container">
    <div th:if="${msg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${msg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="mb-0">我的表单</h3>
        <div class="d-flex gap-2">
            <form class="d-flex" method="get" th:action="@{/admin}">
                <input name="q" class="form-control form-control-sm me-2" placeholder="搜索标题..."
                       th:value="${q}">
                <button class="btn btn-sm btn-outline-secondary">搜索</button>
            </form>
        </div>
    </div>

    <div class="table-responsive fc-card">
        <table class="table table-hover mb-0">
            <thead class="table-light">
            <tr>
                <th>标题</th>
                <th>链接</th>
                <th>状态</th>
                <th>提交数</th>
                <th>创建时间</th>
                <th class="text-end">操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${forms.totalElements == 0}">
                <td colspan="6" class="text-center text-muted py-5">
                    还没有表单，<a th:href="@{/admin/forms/new}">立即创建一个 →</a>
                </td>
            </tr>
            <tr th:each="f : ${forms.content}">
                <td>
                    <a th:href="@{/admin/forms/{id}/edit(id=${f.id})}" th:text="${f.title}"></a>
                </td>
                <td>
                    <code th:text="${'/f/' + f.slug}" class="text-decoration-none"></code>
                    <a th:href="@{/f/{slug}(slug=${f.slug})}" target="_blank"
                       class="text-muted small ms-1">打开</a>
                </td>
                <td>
                    <span class="dot"
                          th:classappend="${f.enabled} ? 'green' : 'gray'"></span>
                    <span th:text="${f.enabled} ? '开启' : '关闭'"></span>
                    <span th:if="${f.deadline != null}"
                          class="ms-1 text-muted small"
                          th:text="'截止 ' + ${#temporals.format(f.deadline, 'MM-dd HH:mm')}"></span>
                </td>
                <td th:text="${f.fields.size()} + ' 字段'"></td>
                <td th:text="${#temporals.format(f.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                <td class="text-end">
                    <a th:href="@{/admin/forms/{id}/submissions(id=${f.id})}"
                       class="btn btn-sm btn-outline-primary">查看提交</a>
                    <a th:href="@{/f/{slug}/export(slug=${f.slug})}"
                       class="btn btn-sm btn-outline-success">导出CSV</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- 分页 -->
    <nav th:if="${forms.totalPages > 1}" class="mt-3">
        <ul class="pagination pagination-sm justify-content-center mb-0">
            <li class="page-item" th:classappend="${forms.number == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/admin(page=${forms.number - 1}, q=${q})}">上一页</a>
            </li>
            <li class="page-item active">
                <span class="page-link"
                      th:text="${forms.number + 1} + ' / ' + ${forms.totalPages}"></span>
            </li>
            <li class="page-item" th:classappend="${forms.number + 1 >= forms.totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/admin(page=${forms.number + 1}, q=${q})}">下一页</a>
            </li>
        </ul>
    </nav>
</main>

<footer th:replace="layout :: footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
</body>
</html>
