<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head('提交详情')"></head>
<body>
<nav th:replace="layout :: navbar('home')"></nav>

<main class="container">
    <div class="mb-3">
        <a th:href="@{/admin/forms/{id}/submissions(id=${form.id})}" class="text-muted">← 返回提交列表</a>
        <h1 class="page-title mt-2">提交详情 #<span th:text="${submission.id}"></span></h1>
        <div class="page-sub">
            提交时间 <span th:text="${#temporals.format(submission.submittedAt, 'yyyy-MM-dd HH:mm:ss')}"></span>
            · IP <span th:text="${submission.ipAddress}"></span>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-6">
            <div class="fc-card fc-card-pad">
                <h2 class="section-title mb-3">字段值</h2>
                <dl class="fc-kv" id="kv-pairs"></dl>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="fc-card fc-card-pad">
                <h2 class="section-title mb-3">原始 JSON</h2>
                <pre class="fc-code-block" th:text="${submission.dataJson}"></pre>
            </div>
        </div>
    </div>
</main>

<footer th:replace="layout :: footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
<script th:inline="javascript">
/*<![CDATA[*/
const FIELDS = /*[[${form.fields}]]*/ [];
const DATA = /*[[${submission.dataJson}]]*/ '{}';

let parsed = {};
try { parsed = JSON.parse(DATA); } catch(e) {}

const ddl = document.getElementById('kv-pairs');
FIELDS.forEach(f => {
    const val = parsed[f.name];
    const valStr = val == null ? ''
        : Array.isArray(val) ? val.join('; ')
        : String(val);
    const dt = document.createElement('dt');
    dt.textContent = f.label + (f.required ? ' *' : '');
    const dd = document.createElement('dd');
    dd.textContent = valStr || '(空)';
    ddl.appendChild(dt);
    ddl.appendChild(dd);
});
/*]]>*/
</script>
</body>
</html>
