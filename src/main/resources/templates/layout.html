<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' — FormCatch'">FormCatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet" crossorigin="anonymous">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<nav th:fragment="navbar(active)" class="navbar navbar-expand fc-navbar mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin}">
            <span class="fc-logo">F</span> FormCatch
        </a>
        <ul class="navbar-nav me-auto ms-3">
            <li class="nav-item">
                <a class="nav-link" th:classappend="${active == 'home'} ? 'active'"
                   th:href="@{/admin}">我的表单</a>
            </li>
        </ul>
        <a class="btn btn-primary btn-sm px-3" th:href="@{/admin/forms/new}">+ 新建表单</a>
    </div>
</nav>

<main th:fragment="main">
    <!-- 公共内容占位 -->
</main>

<footer th:fragment="footer" class="fc-footer">
    FormCatch · 极简表单收集器
</footer>
</body>
</html>
